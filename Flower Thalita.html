<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untuk Thalita</title>
<style>
  /* ============ CUSTOMIZE HERE ============ */
  :root{
    --pink-deep:#e88fa3;
    --pink-mid:#f4b6c2;
    --pink-soft:#fbd9e0;
    --cream:#fff6ee;
    --peach:#f7c9a6;
    --leaf:#8fae7a;
    --leaf-dark:#5f7a4d;
    --text-dark:#5a3b42;
    --kraft:#c8a374;
    --kraft-dark:#a9835a;
    --sunflower:#f4b93c;
    --sunflower-dark:#5a3d1f;
    --sky-blue:#8bb3d9;
  }
  /* Ganti nama di sini juga bisa dilakukan lewat variabel JS di bawah (RECIPIENT_NAME) */

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow-x:hidden;}
  body{
    font-family:'Georgia','Times New Roman',serif;
    background:linear-gradient(160deg,var(--pink-soft),var(--cream) 60%,var(--peach));
    color:var(--text-dark);
    min-height:100vh;
    position:relative;
  }
  h1,h2,.script{
    font-family:'Brush Script MT','Segoe Script',cursive;
  }

  /* ---------- Screens ---------- */
  .screen{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    transition:opacity 1.1s ease, visibility 1.1s ease;
    padding:24px;
  }
  .hidden{opacity:0; visibility:hidden; pointer-events:none;}

  /* Opening */
  #opening{
    background:radial-gradient(circle at 50% 30%, var(--pink-soft), var(--pink-mid) 70%, var(--pink-deep));
    z-index:10;
  }
  #opening h1{
    font-size:clamp(28px,6vw,48px);
    color:#fff;
    text-shadow:0 2px 18px rgba(210,90,120,.5);
    letter-spacing:1px;
    margin-bottom:14px;
  }
  #opening p{color:#fff; opacity:.9; font-size:15px; margin-bottom:36px;}
  #startBtn{
    position:relative;
    padding:16px 52px;
    font-size:16px;
    letter-spacing:2px;
    background:#fff;
    color:var(--pink-deep);
    border:none;
    border-radius:40px;
    cursor:pointer;
    box-shadow:0 8px 30px rgba(180,60,90,.35);
    transition:transform .35s ease, box-shadow .35s ease;
    font-family:Georgia,serif;
  }
  #startBtn:hover{transform:translateY(-3px) scale(1.04); box-shadow:0 12px 34px rgba(180,60,90,.45);}

  /* Main content */
  #main{
    position:relative;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:70px 20px 60px;
    opacity:0;
    transition:opacity 1.4s ease;
  }
  #main.show{opacity:1;}

  .reveal-text{
    font-size:clamp(18px,3.4vw,26px);
    opacity:0; transform:translateY(14px);
    transition:opacity 1.2s ease, transform 1.2s ease;
    margin-bottom:6px;
  }
  .reveal-text.in{opacity:1; transform:translateY(0);}
  #nameText{
    font-family:'Brush Script MT','Segoe Script',cursive;
    font-size:clamp(38px,8vw,68px);
    color:var(--pink-deep);
    text-shadow:0 3px 20px rgba(210,90,120,.25);
    margin:10px 0 30px;
    opacity:0; transform:translateY(18px) scale(.96);
    transition:opacity 1.4s ease, transform 1.4s ease;
  }
  #nameText.in{opacity:1; transform:translateY(0) scale(1);}

  #bouquetWrap{
    position:relative;
    width:min(520px,92vw);
    margin:10px auto 10px;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  #bouquetSvg{width:100%; height:auto; display:block; overflow:visible;}
  .flower-click{
    transform-origin:0px 0px;
    transform-box:fill-box;
    transition:transform .35s ease, filter .35s ease;
  }
  .flower.flower-active .flower-click{
    transform:scale(1.2);
    filter:drop-shadow(0 0 16px rgba(255,224,150,.95));
  }

  .msg-block{
    max-width:520px;
    margin-top:26px;
    opacity:0; transform:translateY(16px);
    transition:opacity 1.2s ease, transform 1.2s ease;
  }
  .msg-block.in{opacity:1; transform:translateY(0);}
  .msg-block p{font-size:17px; line-height:1.9; margin-bottom:6px;}
  .signature{
    font-family:'Brush Script MT','Segoe Script',cursive;
    font-size:26px;
    color:var(--pink-deep);
    margin-top:22px;
  }

  /* floating particles / hearts layer */
  .fx-layer{position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden;}
  .petal-fall, .heart-fall{position:absolute; top:-30px; will-change:transform,opacity;}
  .sparkle{position:absolute; pointer-events:none; z-index:6;}

  @media (max-width:480px){
    #startBtn{padding:14px 40px; font-size:14px;}
    .msg-block p{font-size:15px;}
  }
</style>
</head>
<body>

<!-- FX layer for floating particles / hearts / sparkles -->
<div class="fx-layer" id="fxLayer"></div>

<!-- 1. OPENING SCREEN -->
<section id="opening" class="screen">
  <h1>a little something for you</h1>
  <p>tap when you're ready ♡</p>
  <button id="startBtn">START</button>
</section>

<!-- 2 & 3. MAIN / HERO + BOUQUET -->
<main id="main">
  <p class="reveal-text" id="line1">this flower is for you</p>
  <h2 id="nameText">Thalita Azkia Mylov</h2>

  <div id="bouquetWrap">
    <!-- Bouquet SVG is injected by JS so each flower can be animated individually -->
  </div>

  <div class="msg-block" id="msgBlock">
    <p>Untuk kamu,</p>
    <p>sebuah bunga kecil mungkin tidak bisa menjelaskan semuanya,</p>
    <p>jadi biarkan buket ini yang menyampaikannya.</p>
    <div class="signature">Made with love, just for Thalita ♡</div>
  </div>
</main>

<script>
/* ============ CUSTOMIZE: nama & pesan bisa diganti di sini juga ============ */
const RECIPIENT_NAME = "Thalita Azkia Mylov";

const startBtn = document.getElementById('startBtn');
const opening  = document.getElementById('opening');
const mainEl   = document.getElementById('main');
const fxLayer  = document.getElementById('fxLayer');

/* ---------- Opening screen ambient fx (petals + hearts + glow) ---------- */
function spawnAmbient(container, count, kind){
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = kind === 'heart' ? 'heart-fall' : 'petal-fall';
    const left = Math.random()*100;
    const size = 10 + Math.random()*14;
    const dur  = 9 + Math.random()*8;
    const delay = Math.random()*8;
    el.style.left = left+'vw';
    el.style.opacity = .55 + Math.random()*.35;
    el.innerHTML = kind === 'heart'
      ? `<svg width="${size}" height="${size}" viewBox="0 0 32 29"><path fill="#ffffff" d="M16 29C6 21 0 15.5 0 9.5 0 4.3 4.2 0 9.3 0c2.8 0 5.3 1.3 6.7 3.4C17.4 1.3 19.9 0 22.7 0 27.8 0 32 4.3 32 9.5 32 15.5 26 21 16 29z"/></svg>`
      : `<svg width="${size}" height="${size}" viewBox="0 0 20 20"><path fill="#ffe3ea" d="M10 0C13 5 20 7 10 20C0 7 7 5 10 0Z"/></svg>`;
    el.style.animation = `fall${kind==='heart'?'H':'P'} ${dur}s linear ${delay}s infinite`;
    container.appendChild(el);
  }
}
const styleSheet = document.createElement('style');
styleSheet.textContent = `
@keyframes fallP{ 0%{transform:translateY(-5vh) rotate(0deg);} 100%{transform:translateY(105vh) rotate(340deg);} }
@keyframes fallH{ 0%{transform:translateY(-5vh) rotate(0deg) scale(.8);} 100%{transform:translateY(105vh) rotate(-200deg) scale(1);} }
@keyframes sparklePop{ 0%{transform:scale(0); opacity:1;} 60%{transform:scale(1.1); opacity:1;} 100%{transform:scale(0); opacity:0;} }
@keyframes stemGrow{ from{stroke-dashoffset:var(--len);} to{stroke-dashoffset:0;} }
@keyframes bloomIn{ from{transform:scale(.15); opacity:0;} to{transform:scale(1); opacity:1;} }
@keyframes gentleSway{ 0%,100%{transform:rotate(-1.4deg);} 50%{transform:rotate(1.4deg);} }
@keyframes leafFloat{ 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-4px) rotate(2deg);} }
`;
document.head.appendChild(styleSheet);
spawnAmbient(opening, 14, 'petal');
spawnAmbient(opening, 6, 'heart');

/* ---------- Sparkle trail on pointer move (opening screen not needed, but on bouquet later) ---------- */

/* ---------- START button ---------- */
startBtn.addEventListener('click', () => {
  opening.classList.add('hidden');
  setTimeout(()=>{
    mainEl.classList.add('show');
    buildBouquet();
    sequenceReveal();
  }, 500);
});

/* ---------- Staged text reveal ---------- */
function sequenceReveal(){
  const line1 = document.getElementById('line1');
  const name  = document.getElementById('nameText');
  name.textContent = RECIPIENT_NAME;
  setTimeout(()=>line1.classList.add('in'), 200);
  setTimeout(()=>name.classList.add('in'), 1000);
  setTimeout(()=>animateBouquetIn(), 1900);
  setTimeout(()=>document.getElementById('msgBlock').classList.add('in'), 4200);
}

/* =========================================================
   BOUQUET — built entirely with inline SVG (no images)
   Structure: wrapping paper cone -> ribbon -> stems -> leaves -> flowers
   ========================================================= */
function buildBouquet(){
  const wrap = document.getElementById('bouquetWrap');

  // Flower "recipes": each defines petal color, center color, position, size, delay
  // CUSTOMIZE: tambah/kurangi objek di array ini untuk mengubah jumlah & warna bunga
  // Komposisi ini terinspirasi foto referensi: sunflower kuning besar, pink lily,
  // gerbera putih & kuning, aksen biru, filler putih kecil.
  const flowers = [
    {type:'sunflower', x:170, y:140, r:44, petals:'#f4b93c', center:'#5a3d1f', delay:0.15},
    {type:'sunflower', x:320, y:150, r:38, petals:'#f6c453', center:'#5a3d1f', delay:0.30},
    {type:'lily',  x:245, y:180, r:42, petals:'#ef7fa0', center:'#c44b68', delay:0.45},
    {type:'daisy', x:200, y:210, r:28, petals:'#ffffff', center:'#f6c453', delay:0.60},
    {type:'daisy', x:295, y:205, r:26, petals:'#ffffff', center:'#e8677f', delay:0.75},
    {type:'small', x:145, y:195, r:15, petals:'#8bb3d9', center:'#ffffff', delay:0.90},
    {type:'small', x:355, y:200, r:15, petals:'#8bb3d9', center:'#ffffff', delay:1.00},
    {type:'daisy', x:165, y:240, r:24, petals:'#f6c453', center:'#5a3d1f', delay:1.10},
    {type:'lily',  x:250, y:250, r:32, petals:'#ef7fa0', center:'#c44b68', delay:1.20},
    {type:'small', x:330, y:245, r:14, petals:'#8bb3d9', center:'#ffffff', delay:1.30},
    {type:'small', x:200, y:265, r:13, petals:'#ffffff', center:'#f6c453', delay:1.40},
    {type:'small', x:290, y:270, r:13, petals:'#ffffff', center:'#e8677f', delay:1.50},
  ];

  let flowerDefs = '';
  let flowerUse  = '';

  flowers.forEach((f,i)=>{
    flowerDefs += flowerSVG(f, i);
  });

  const svg = `
  <svg id="bouquetSvg" viewBox="0 0 500 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d9b98a"/>
        <stop offset="100%" stop-color="#b98f5e"/>
      </linearGradient>
      <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#e6c9a0"/>
        <stop offset="100%" stop-color="#f3ddb8"/>
      </linearGradient>
    </defs>

    <!-- wrapping paper cone (kraft/burlap style, like reference photo) -->
    <path d="M115 300 L250 555 L385 300 Q250 340 115 300 Z" fill="url(#paperGrad)" stroke="#96703f" stroke-width="2"/>
    <path d="M140 305 L250 520 L360 305" fill="none" stroke="#c9a26e" stroke-width="1.5" opacity=".6"/>
    <path d="M160 320 L250 500 L340 320" fill="none" stroke="#c9a26e" stroke-width="1" opacity=".4"/>

    <!-- ribbon -->
    <g>
      <rect x="205" y="330" width="90" height="26" rx="4" fill="url(#ribbonGrad)" stroke="#a9773f" stroke-width="1.5"/>
      <path d="M205 343 L175 320 L185 355 Z" fill="#f3ddb8" stroke="#a9773f" stroke-width="1.5"/>
      <path d="M295 343 L325 320 L315 355 Z" fill="#f3ddb8" stroke="#a9773f" stroke-width="1.5"/>
      <circle cx="250" cy="343" r="7" fill="#fbeed9" stroke="#a9773f" stroke-width="1.5"/>
    </g>

    <!-- stems -->
    <g id="stems" stroke="#6e8f57" stroke-width="4" fill="none" stroke-linecap="round">
      ${flowers.map((f,i)=>`<path class="stem" data-i="${i}" d="M250,345 Q${(f.x+250)/2},${(f.y+345)/2+20} ${f.x},${f.y+f.r*0.6}" pathLength="100" style="stroke-dasharray:100; stroke-dashoffset:100; animation:stemGrow 0.9s ease forwards ${f.delay*0.6}s;"/>`).join('')}
    </g>

    <!-- leaves -->
    <g id="leaves" fill="#7fa066">
      <g style="animation:leafFloat 4.5s ease-in-out infinite;"><path d="M175 300 Q150 275 130 290 Q150 310 175 300 Z"/></g>
      <g style="animation:leafFloat 5s ease-in-out infinite .4s;"><path d="M330 300 Q360 270 380 288 Q358 312 330 300 Z"/></g>
      <g style="animation:leafFloat 4.8s ease-in-out infinite .8s;"><path d="M250 320 Q245 290 225 285 Q235 315 250 320 Z"/></g>
    </g>

    <!-- flowers -->
    <g id="flowersGroup">
      ${flowerDefs}
    </g>
  </svg>`;

  wrap.innerHTML = svg;

  // interactivity: click a flower -> enlarge + glow + burst petals
  wrap.querySelectorAll('.flower').forEach(f=>{
    f.style.cursor = 'pointer';
    f.addEventListener('click', (e)=>{
      f.classList.toggle('flower-active');
      burstPetals(e.clientX, e.clientY, 6);
    });
  });

  // click bouquet area -> petals fly
  wrap.addEventListener('click', (e)=>{
    burstPetals(e.clientX, e.clientY, 4);
  });

  // pointer sparkle trail + gentle parallax
  let lastSpark = 0;
  wrap.addEventListener('pointermove', (e)=>{
    const now = Date.now();
    if(now - lastSpark > 90){
      lastSpark = now;
      makeSparkle(e.clientX, e.clientY);
    }
    const rect = wrap.getBoundingClientRect();
    const cx = (e.clientX - rect.left)/rect.width - 0.5;
    const cy = (e.clientY - rect.top)/rect.height - 0.5;
    const svgEl = document.getElementById('bouquetSvg');
    svgEl.style.transform = `rotate(${cx*1.5}deg) translate(${cx*6}px, ${cy*4}px)`;
    svgEl.style.transition = 'transform .25s ease-out';
  });
}

/* Generate one flower's SVG markup (lily / daisy / small filler) */
function flowerSVG(f, i){
  const petalCount = f.type==='sunflower' ? 13 : f.type==='lily' ? 6 : f.type==='daisy' ? 8 : 5;
  let petals = '';
  for(let p=0; p<petalCount; p++){
    const angle = (360/petalCount)*p;
    const petalLen = f.r;
    const petalW = f.r*0.55;
    if(f.type==='sunflower'){
      // narrow, pointed petals typical of a sunflower
      petals += `<path d="M0,0 L${-petalW*0.18},${-petalLen*0.35} L0,${-petalLen} L${petalW*0.18},${-petalLen*0.35} Z"
                  fill="${f.petals}" opacity="0.97"
                  transform="rotate(${angle})"/>`;
    } else {
      petals += `<ellipse cx="0" cy="${-petalLen*0.55}" rx="${petalW*0.4}" ry="${petalLen*0.55}"
                  fill="${f.petals}" opacity="0.95"
                  transform="rotate(${angle})"/>`;
    }
  }
  const centerR = f.r*0.32;
  const sway = 2.5 + Math.random()*2.5;

  return `
    <g class="flower" data-i="${i}" transform="translate(${f.x},${f.y})">
      <g class="flower-click">
        <g class="flower-anim"
           style="transform-origin:0px 0px; transform-box:fill-box; opacity:0; animation:bloomIn 0.7s cubic-bezier(.34,1.56,.64,1) forwards ${f.delay}s, gentleSway ${sway}s ease-in-out infinite ${f.delay}s;">
          <g class="petals">${petals}</g>
          <circle r="${centerR}" fill="${f.center}"/>
          <circle r="${centerR*0.45}" fill="#fff8ee" opacity=".8"/>
        </g>
      </g>
    </g>`;
}

/* animate-in trigger: bouquet already scheduled via inline animation-delay, this just ensures wrap fades/scales */
function animateBouquetIn(){
  const wrap = document.getElementById('bouquetWrap');
  wrap.style.opacity = 0;
  wrap.style.transform = 'translateY(20px) scale(.94)';
  wrap.style.transition = 'opacity 1s ease, transform 1s ease';
  requestAnimationFrame(()=>{
    wrap.style.opacity = 1;
    wrap.style.transform = 'translateY(0) scale(1)';
  });
}

/* ---------- petal burst on click ---------- */
function burstPetals(x, y, n){
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.style.position='fixed';
    p.style.left = x+'px';
    p.style.top = y+'px';
    p.style.pointerEvents='none';
    p.style.zIndex = 7;
    p.innerHTML = `<svg width="14" height="14" viewBox="0 0 20 20"><path fill="#f2a0b6" d="M10 0C13 5 20 7 10 20C0 7 7 5 10 0Z"/></svg>`;
    document.body.appendChild(p);
    const angle = Math.random()*Math.PI*2;
    const dist = 40+Math.random()*70;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 30;
    p.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${dx}px, ${dy+120}px) rotate(${180+Math.random()*180}deg)`, opacity:0}
    ], {duration:1100+Math.random()*400, easing:'cubic-bezier(.2,.6,.3,1)'});
    setTimeout(()=>p.remove(), 1600);
  }
}

/* ---------- sparkle on pointer move over bouquet ---------- */
function makeSparkle(x,y){
  const s = document.createElement('div');
  s.className='sparkle';
  s.style.left = x+'px';
  s.style.top = y+'px';
  s.innerHTML = `<svg width="10" height="10" viewBox="0 0 10 10"><path fill="#fff2c4" d="M5 0 L6 4 L10 5 L6 6 L5 10 L4 6 L0 5 L4 4 Z"/></svg>`;
  s.style.animation = 'sparklePop .7s ease forwards';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(), 750);
}

/* touch support: map touchmove to same sparkle/parallax handler */
document.addEventListener('touchmove', (e)=>{
  const t = e.touches[0];
  if(!t) return;
  const wrap = document.getElementById('bouquetWrap');
  if(!wrap) return;
  const rect = wrap.getBoundingClientRect();
  if(t.clientX>=rect.left && t.clientX<=rect.right && t.clientY>=rect.top && t.clientY<=rect.bottom){
    makeSparkle(t.clientX, t.clientY);
  }
}, {passive:true});
</script>
</body>
</html>
